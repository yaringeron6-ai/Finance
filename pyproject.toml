[project]
name = "finance-radar"
version = "0.1.0"
description = "Financial radar for controllers: stale balances, recurring gaps, trends, anomalies and broken relationships in trial balances"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
"radar.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
