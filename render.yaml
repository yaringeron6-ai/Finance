services:
  - type: web
    name: finance-radar  # keeps the existing Render URL
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn radar.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_PASSWORD
        sync: false
