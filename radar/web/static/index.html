<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello Fin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: a calm ledger workspace. App bar, a short intro with the upload panel,
   then the month-end review first and the detailed findings below it. */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --surface-2: #e9efed; --ink: #0e1b17; --muted: #5b6b66; --line: #dbe3e0;
  --brand: #0b6e5f; --brand-ink: #ffffff; --brand-soft: #dcefe9; --bar: #c5d1cd; --ref: #3559a8;
  --issue: #b83f2b; --issue-soft: #fbe5df; --explain: #9a6200; --explain-soft: #fff0d3; --ok: #1d7448; --ok-soft: #def1e6;
  --shadow: 0 1px 2px rgba(14, 27, 23, .06), 0 4px 16px rgba(14, 27, 23, .04);
  --font-display: "Rubik", "Heebo", system-ui, sans-serif;
  --font-body: "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1311; --surface: #131c19; --surface-2: #1a2522; --ink: #e5eeeb; --muted: #93a39e; --line: #25322e;
    --brand: #3cc2a6; --brand-ink: #05201a; --brand-soft: #143029; --bar: #33423e; --ref: #8fa9e8;
    --issue: #f08a74; --issue-soft: #3a1d17; --explain: #e8b54d; --explain-soft: #33280f; --ok: #5bc98d; --ok-soft: #14301f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1311; --surface: #131c19; --surface-2: #1a2522; --ink: #e5eeeb; --muted: #93a39e; --line: #25322e;
  --brand: #3cc2a6; --brand-ink: #05201a; --brand-soft: #143029; --bar: #33423e; --ref: #8fa9e8;
  --issue: #f08a74; --issue-soft: #3a1d17; --explain: #e8b54d; --explain-soft: #33280f; --ok: #5bc98d; --ok-soft: #14301f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.01em; text-wrap: balance; margin: 0; }
a { color: var(--brand); }
button, .btn { font: 500 14px/1 var(--font-body); border-radius: 10px; padding: 11px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: .45; cursor: default; filter: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hidden { display: none !important; }

/* App bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink); text-decoration: none; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand small { font: 500 12px var(--font-body); color: var(--muted); margin-inline-start: 6px; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; background: var(--surface); }
.langs button { border: 0; border-radius: 99px; padding: 6px 12px; font-size: 13px; background: transparent; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

/* Intro and upload */
.intro { padding-block: 36px 8px; display: grid; gap: 22px; }
.intro h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; max-width: 22ch; }
.intro p.lead { margin: 10px 0 0; color: var(--muted); font-size: 17px; max-width: 60ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.upload { display: grid; grid-template-columns: 1.4fr 1fr; overflow: hidden; }
.drop { margin: 14px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px 20px; display: grid; gap: 6px; place-items: center; text-align: center; cursor: pointer; background: var(--surface-2); min-height: 170px; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--brand); border: 1px solid var(--line); }
.drop strong { font-size: 16px; }
.drop span { color: var(--muted); font-size: 13px; max-width: 46ch; }
.side { padding: 20px; display: grid; gap: 14px; align-content: start; border-inline-start: 1px solid var(--line); min-width: 0; }
.side .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.side label.small { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.side input[type=file] { font-size: 13px; color: var(--muted); max-width: 100%; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.chip.on { background: var(--ok-soft); color: var(--ok); }
.label { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.note { background: var(--brand-soft); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.error { background: var(--issue-soft); color: var(--issue); border-radius: 10px; padding: 12px 14px; }
.warn { background: var(--explain-soft); color: var(--explain); border-radius: 10px; padding: 10px 14px; font-size: 14px; }

/* Results */
.results { padding-block: 28px 72px; display: grid; gap: 34px; }
.subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 55px); z-index: 10; background: var(--bg); padding-block: 8px; margin-block: -8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.subnav a { flex: none; font-size: 13px; padding: 6px 12px; border-radius: 99px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); background: var(--surface); }
.subnav a:hover { color: var(--ink); }
.subnav .count { font-variant-numeric: tabular-nums; color: var(--brand); margin-inline-start: 6px; font-weight: 600; }
.meta { color: var(--muted); font-size: 14px; }
.meta b { color: var(--ink); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.tile .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--font-display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.tile .s { font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.issue { background: var(--issue); } .dot.explain { background: var(--explain); } .dot.ok { background: var(--ok); } .dot.brand { background: var(--brand); }
section.block { display: grid; gap: 12px; scroll-margin-top: 120px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.head h2 { font-size: 22px; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; letter-spacing: .02em; background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.num { font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.num span, td.num { unicode-bidi: plaintext; }
.acct { white-space: nowrap; font-weight: 500; }
.acct small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.review td.notes { color: var(--muted); font-size: 13px; min-width: 220px; max-width: 340px; }
.review tr.issue td.acct { box-shadow: inset 3px 0 0 var(--issue); }
.review tr.explain td.acct { box-shadow: inset 3px 0 0 var(--explain); }
[dir="rtl"] .review tr.issue td.acct { box-shadow: inset -3px 0 0 var(--issue); }
[dir="rtl"] .review tr.explain td.acct { box-shadow: inset -3px 0 0 var(--explain); }
.pill { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.explain { color: var(--explain); background: var(--explain-soft); }
.pill.issue { color: var(--issue); background: var(--issue-soft); }
.findings { display: grid; gap: 10px; }
.finding { overflow: hidden; }
.finding summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto 20px; gap: 14px; align-items: center; }
.finding summary::-webkit-details-marker { display: none; }
.finding .t { font-weight: 600; font-size: 15px; }
.finding .tags { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.finding .amt { font-family: var(--font-display); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; unicode-bidi: plaintext; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
.finding[open] .chev { transform: rotate(180deg); }
.finding .body { padding: 4px 18px 20px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding-top: 14px; }
.body h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .03em; }
.body p { margin: 0; }
.items { border: 1px solid var(--line); border-radius: 10px; }
.items td, .items th { padding: 8px 10px; font-size: 13px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.empty { color: var(--muted); padding: 18px; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .chev { transition: none; } }
@media (max-width: 820px) {
  .upload { grid-template-columns: 1fr; }
  .side { border-inline-start: 0; border-top: 1px solid var(--line); }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .tile { padding: 14px; }
  .tile .v { font-size: 22px; }
  .brand small { display: none; }
  .finding summary { grid-template-columns: 1fr auto; }
  .chev { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Hello Fin">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--brand)"/>
        <circle cx="16" cy="16" r="9" fill="none" stroke="var(--brand-ink)" stroke-opacity=".35" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="4.5" fill="none" stroke="var(--brand-ink)" stroke-opacity=".55" stroke-width="1.5"/>
        <path d="M16 16 L23.5 10.5" stroke="var(--brand-ink)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="21" cy="20.5" r="1.8" fill="var(--brand-ink)"/>
      </svg>
      <span>Hello Fin<small data-t="tagline"></small></span>
    </a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="lang-he" data-lang="he">עברית</button>
      <button type="button" id="lang-en" data-lang="en">English</button>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <div class="intro">
    <div>
      <h1 data-t="heroTitle"></h1>
      <p class="lead" data-t="heroLead"></p>
    </div>
    <section class="panel upload" id="uploadPanel">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
        <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span>
        <strong id="fileLabel" data-t="pick"></strong>
        <span data-t="pickHint"></span>
      </label>
      <div class="side">
        <div class="actions">
          <button class="primary" id="run" type="button" disabled data-t="analyze"></button>
          <button id="demo" type="button" data-t="runDemo"></button>
        </div>
        <label class="small"><span data-t="targetsLabel"></span><input type="file" id="targets" accept=".xlsx,.xls,.csv"></label>
        <div class="links"><a id="sampleLines" href="/api/demo/transactions" data-t="sampleLines"></a><a id="sampleTb" href="/api/demo/file" data-t="sampleTb"></a></div>
        <div><div class="label" data-t="sources"></div><div class="chips" id="connectors"></div></div>
      </div>
    </section>
    <div class="note hidden" id="staticNote" data-t="staticNote"></div>
    <div id="error" class="error hidden" role="alert"></div>
  </div>

  <div id="results" class="results hidden">
    <nav class="subnav" id="subnav" aria-label="Sections"></nav>
    <div class="meta" id="meta"></div>
    <div id="warnings"></div>
    <div class="tiles" id="tiles"></div>

    <section class="block" id="review-section">
      <div class="head">
        <div><h2 data-t="review"></h2><p data-t="reviewIntro"></p></div>
        <a class="btn hidden" id="exportBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg><span data-t="exportExcel"></span></a>
      </div>
      <div class="panel scroll" id="review"></div>
    </section>

    <section class="block" id="historical-section">
      <div class="head"><div><h2 data-t="historical"></h2><p data-t="historicalIntro"></p></div></div>
      <div class="findings" id="historical"></div>
    </section>

    <section class="block" id="alerts-section">
      <div class="head"><div><h2 data-t="alerts"></h2><p data-t="alertsIntro"></p></div></div>
      <div class="findings" id="alerts"></div>
    </section>

    <section class="block hidden" id="aging-section">
      <div class="head"><div><h2 data-t="agingTitle"></h2><p data-t="agingIntro"></p></div></div>
      <div class="panel scroll" id="aging"></div>
    </section>

    <section class="block" id="relations-section">
      <div class="head"><div><h2 data-t="relationsTitle"></h2><p data-t="relationsIntro"></p></div></div>
      <div class="panel scroll" id="relationships"></div>
    </section>
  </div>
</main>
<footer class="wrap" data-t="footer"></footer>

<script>
const I18N = {
  he: {

    review: "סקירת מאזן", historical: "סריקה היסטורית", alerts: "התראות", aging: "גיול", relations: "קשרים",

    tileAttention: "כרטיסים מאזניים לטיפול", tileOf: "מתוך", tileAttentionSub: (i, e) => `${i} לטיפול · ${e} נדרש הסבר`,

    targetsLabel: "Monthly targets file (optional): account, monthly target",
    sampleLines: "Sample ledger lines", sampleTb: "Sample trial balance",
    sources: "Data sources", soon: "soon",
    staticNote: "This view shows a made-up company's demo data. Uploading files and the Excel download work in the full app.",
    review: "Balance sheet review", historical: "Historical scan", alerts: "Alerts", aging: "Aging", relations: "Relationships",
    reviewIntro: "Every balance-sheet account, month by month. Accounts marked OK need nothing. The Excel file has every month plus columns for explanations and sign-off.",
    exportExcel: "Download Excel",
    historicalIntro: "Items open for more than a year, what they add up to, and patterns that return in the same month every year.",
    alertsIntro: "What changed in recent months: trends, unusual months and account relationships that broke.",
    agingTitle: "Customer and supplier aging", agingIntro: "Open balances by age in days, after matching invoices to payments.",
    relationsTitle: "Account relationships", relationsIntro: "Accounts that move together over time. When the ratio between them shifts, an alert appears.",
    tileAttention: "Balance-sheet accounts to act on", tileOf: "of", tileAttentionSub: (i, e) => `${i} action · ${e} explain`,
    tileStale: "Open for over a year", tileStaleSub: (n) => `in ${n} accounts`,
    tileRecurring: "Patterns every year", tileRecurringSub: "Same month, year after year",
    tileAlerts: "Recent alerts", tileAlertsSub: (a) => `${a} at stake`,
    why: "Why it was flagged", check: "What to check", openItems: "Open items",
    date: "Date", ref: "Reference", details: "Description", amount: "Amount", days: "Days",
    account: "Account", change: "Change", status: "Status", findings: "Findings", total: "Total",
    movesWith: "Moves with", usualRatio: "Usual ratio", correlation: "Correlation",
    noHistorical: "Nothing has been dragging on.", noAlerts: "No alerts for recent months.", noRelations: "No stable relationships found.",
    meta: (r) => `${r.company ? `<b>${esc(r.company)}</b> · ` : ""}${r.period_from} to ${r.period_to} · ${r.months} months · ${r.accounts} accounts · ${r.source === "transactions" ? "from ledger lines" : "from a trial balance"}`,
    kinds: { stale_balance: "Stale balance", old_items: "Open items", recurring: "Recurring", trend: "Trend", anomaly: "Unusual month", relation_break: "Broken relationship" },
    cardAccount: "Account", reviewPill: "To review",
    footer: "Every finding is marked \"to review\", not as an error. The decision, especially on tax matters, stays with the controller or tax adviser.",
    errorGeneric: "Something went wrong with the analysis. Try again.",
  },
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATIC = window.HF_STATIC || null;
let lang = "he", lastRequest = null, connectorList = [];
const t = (k) => I18N[lang][k];
const fmt = (v) => Math.round(v).toLocaleString("en-US");
const ils = (v) => lang === "en" ? `${v < 0 ? "-" : ""}₪${fmt(Math.abs(v))}` : `${v < 0 ? "-" : ""}${fmt(Math.abs(v))} ₪`;

function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } }

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("sampleLines").href = `/api/demo/transactions?lang=${lang}`;
  $("sampleTb").href = `/api/demo/file?lang=${lang}`;
  if ($("file").files[0]) $("fileLabel").textContent = $("file").files[0].name;
  renderConnectors();
}

function renderConnectors() {
  $("connectors").innerHTML = connectorList.map((c) => {
    const name = lang === "en" ? (c.display_name_en || c.display_name) : c.display_name;
    const desc = lang === "en" ? (c.description_en || c.description) : c.description;
    const on = c.status === "available";
    return `<span class="chip ${on ? "on" : ""}" title="${esc(desc)}">${esc(name)}${on ? "" : " · " + t("soon")}</span>`;
  }).join("");
}

function chart(ev) {
  const pts = ev.series, n = pts.length;
  if (!n) return "";
  // Draw at the real width so text stays at its true size on every screen.
  const host = $("historical").clientWidth || 640;
  const W = Math.max(300, Math.min(1000, host - 38)), H = W < 500 ? 170 : 200, top = 16, bottom = 26, side = 8, labelW = W < 500 ? 74 : 96;
  const rtl = lang === "he";
  const pct = ev.label.startsWith("%");
  const vals = pts.map((p) => p.value).concat(ev.reference != null ? [ev.reference] : []);
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const span = max - min || 1;
  const y = (v) => top + (max - v) / span * (H - top - bottom);
  const plotL = rtl ? side + labelW : side, plotR = rtl ? W - side : W - side - labelW;
  const bw = (plotR - plotL) / n;
  // Time runs in reading direction: right to left in Hebrew, left to right in English.
  const x = (i) => rtl ? plotR - (i + 1) * bw : plotL + i * bw;
  const hl = new Set(ev.highlight);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ev.label)}">`;
  if (max > 0) s += `<line x1="${plotL}" x2="${plotR}" y1="${y(max / 2)}" y2="${y(max / 2)}" stroke="var(--line)" stroke-dasharray="2 4"/>`;
  s += `<line x1="${plotL}" x2="${plotR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  const every = Math.ceil(n / (W < 500 ? 4 : 8));
  pts.forEach((p, i) => {
    const v = p.value, y0 = y(Math.max(v, 0)), h = Math.abs(y(v) - y(0));
    const on = hl.has(p.period);
    s += `<rect x="${x(i) + bw * 0.16}" y="${y0}" width="${bw * 0.68}" height="${Math.max(h, 1)}" rx="${Math.min(3, bw * 0.2)}" fill="${on ? "var(--brand)" : "var(--bar)"}"><title>${p.period}: ${pct ? v.toFixed(1) + "%" : ils(v)}</title></rect>`;
    if ((n - 1 - i) % every === 0) s += `<text x="${x(i) + bw / 2}" y="${H - 8}" text-anchor="middle" direction="ltr">${p.period}</text>`;
  });
  if (ev.reference != null) {
    const ry = y(ev.reference);
    const tx = rtl ? side + labelW - 8 : plotR + 8, anchor = rtl ? "end" : "start";
    const lbl = pct ? ev.reference.toFixed(1) + "%" : ils(ev.reference);
    s += `<line x1="${plotL}" x2="${plotR}" y1="${ry}" y2="${ry}" stroke="var(--ref)" stroke-dasharray="6 4" stroke-width="1.5"/>`;
    s += `<text x="${tx}" y="${ry - 4}" text-anchor="${anchor}" style="fill:var(--ref)">${esc(ev.reference_label || "")}</text>`;
    s += `<text x="${tx}" y="${ry + 12}" text-anchor="${anchor}" style="fill:var(--ref);font-weight:600">${lbl}</text>`;
  }
  return s + "</svg>";
}

function itemsTable(items) {
  if (!items || !items.length) return "";
  return `<div><h4>${t("openItems")}</h4><div class="items scroll"><table><thead><tr><th>${t("date")}</th><th>${t("ref")}</th><th>${t("details")}</th><th class="num">${t("amount")}</th><th class="num">${t("days")}</th></tr></thead><tbody>${
    items.map((x) => `<tr><td class="acct">${x.date}</td><td>${esc(x.reference)}</td><td>${esc(x.description)}</td><td class="num">${ils(Math.abs(x.amount))}</td><td class="num">${x.age_days}</td></tr>`).join("")
  }</tbody></table></div></div>`;
}

const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
function findingCard(f) {
  return `<details class="panel finding">
    <summary>
      <div><div class="t">${esc(f.title)}</div>
        <div class="tags"><span class="pill issue">${t("reviewPill")}</span><span>${t("kinds")[f.kind] || f.kind} · ${t("cardAccount")} ${esc(f.account)}</span></div></div>
      <div class="amt">${ils(f.amount)}</div>${CHEV}
    </summary>
    <div class="body">
      <div class="cols"><div><h4>${t("why")}</h4><p>${esc(f.reason)}</p></div><div><h4>${t("check")}</h4><p>${esc(f.check)}</p></div></div>
      ${itemsTable(f.details.items)}
      <div><h4>${esc(f.evidence.label)}</h4>${chart(f.evidence)}</div>
    </div>
  </details>`;
}

function reviewTable(rv) {
  // The page shows the last 4 months; the Excel download has every month.
  const cols = rv.periods.slice(-4);
  const head = `<tr><th>${t("account")}</th>${cols.map((p) => `<th class="num">${p}</th>`).join("")}<th class="num">${t("change")}</th><th>${t("status")}</th><th>${t("findings")}</th></tr>`;
  const rows = rv.rows.map((r) => `<tr class="${r.status}"><td class="acct">${esc(r.name)}<small>${esc(r.account)}</small></td>${
    cols.map((p) => `<td class="num">${fmt(r.balances[p] ?? 0)}</td>`).join("")
  }<td class="num">${r.change > 0 ? "+" : ""}${fmt(r.change)}</td><td><span class="pill ${r.status}"><span class="dot ${r.status}"></span>${esc(r.status_label)}</span></td><td class="notes">${r.notes.map(esc).join("<br>")}</td></tr>`).join("");
  return `<table class="review"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function agingTable(rows) {
  const labels = Object.keys(rows[0].buckets);
  return `<table><thead><tr><th>${t("account")}</th>${labels.map((l) => `<th class="num">${l}</th>`).join("")}<th class="num">${t("total")}</th></tr></thead><tbody>${
    rows.map((r) => `<tr><td class="acct">${esc(r.name)}<small>${esc(r.account)}</small></td>${labels.map((l) => `<td class="num">${fmt(r.buckets[l])}</td>`).join("")}<td class="num"><b>${fmt(r.total)}</b></td></tr>`).join("")
  }</tbody></table>`;
}

function render(r) {
  $("results").classList.remove("hidden");
  $("meta").innerHTML = t("meta")(r);
  $("warnings").innerHTML = r.warnings.map((w) => `<div class="warn">${esc(w)}</div>`).join("");
  const s = r.summary, c = r.review.counts;
  $("tiles").innerHTML = `
    <div class="panel tile"><div class="k"><span class="dot issue"></span>${t("tileAttention")}</div><div class="v">${c.issue + c.explain} <small>${t("tileOf")} ${c.ok + c.issue + c.explain}</small></div><div class="s">${t("tileAttentionSub")(c.issue, c.explain)}</div></div>
    <div class="panel tile"><div class="k"><span class="dot explain"></span>${t("tileStale")}</div><div class="v"><span style="unicode-bidi:plaintext">${ils(s.stale_total)}</span></div><div class="s">${t("tileStaleSub")(s.stale_count)}</div></div>
    <div class="panel tile"><div class="k"><span class="dot brand"></span>${t("tileRecurring")}</div><div class="v">${s.recurring_count}</div><div class="s">${t("tileRecurringSub")}</div></div>
    <div class="panel tile"><div class="k"><span class="dot brand"></span>${t("tileAlerts")}</div><div class="v">${s.alerts_count}</div><div class="s">${t("tileAlertsSub")(ils(s.alerts_total))}</div></div>`;
  $("review").innerHTML = reviewTable(r.review);
  const exp = $("exportBtn");
  if (r.id && !STATIC) { exp.href = `/api/review/${r.id}.xlsx`; exp.classList.remove("hidden"); } else exp.classList.add("hidden");
  $("historical").innerHTML = r.historical.length ? r.historical.map(findingCard).join("") : `<div class="panel empty">${t("noHistorical")}</div>`;
  $("alerts").innerHTML = r.alerts.length ? r.alerts.map(findingCard).join("") : `<div class="panel empty">${t("noAlerts")}</div>`;
  const hasAging = Boolean(r.aging && r.aging.length);
  $("aging-section").classList.toggle("hidden", !hasAging);
  if (hasAging) $("aging").innerHTML = agingTable(r.aging);
  $("relationships").innerHTML = r.relationships.length
    ? `<table><thead><tr><th>${t("account")}</th><th>${t("movesWith")}</th><th class="num">${t("usualRatio")}</th><th class="num">${t("correlation")}</th></tr></thead><tbody>${
        r.relationships.map((x) => `<tr><td>${esc(x.account_name)}</td><td>${esc(x.driver_name)}</td><td class="num">${(x.ratio * 100).toFixed(1)}%</td><td class="num">${x.correlation.toFixed(2)}</td></tr>`).join("")
      }</tbody></table>`
    : `<div class="empty">${t("noRelations")}</div>`;
  const nav = [["review-section", t("review"), c.issue + c.explain], ["historical-section", t("historical"), r.historical.length],
    ["alerts-section", t("alerts"), r.alerts.length]];
  if (hasAging) nav.push(["aging-section", t("aging"), null]);
  nav.push(["relations-section", t("relations"), null]);
  $("subnav").innerHTML = nav.map(([id, label, n]) => `<a href="#${id}">${esc(label)}${n != null ? `<span class="count">${n}</span>` : ""}</a>`).join("");
  const first = document.querySelector("#historical .finding");
  if (first) first.open = true;
}

function setBusy(btn, busy) {
  btn.disabled = busy;
  btn.innerHTML = busy ? `<span class="spin"></span>${esc(t("analyzing"))}` : esc(t(btn.dataset.t));
}

async function request(kind, btn, scroll = true) {
  lastRequest = kind;
  $("error").classList.add("hidden");
  if (STATIC) { render(STATIC.reports[lang]); return; }
  if (btn) setBusy(btn, true);
  try {
    let res;
    if (kind === "demo") res = await fetch(`/api/demo?lang=${lang}`);
    else {
      const fd = new FormData();
      fd.append("file", $("file").files[0]);
      if ($("targets").files[0]) fd.append("targets", $("targets").files[0]);
      res = await fetch(`/api/analyze?lang=${lang}`, { method: "POST", body: fd });
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || t("errorGeneric"));
    render(body);
    if (scroll) $("results").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  } catch (e) {
    $("error").textContent = e.message || t("errorGeneric");
    $("error").classList.remove("hidden");
  } finally {
    if (btn) setBusy(btn, false);
    $("run").disabled = !$("file").files[0];
  }
}

function setFile(f) {
  $("fileLabel").textContent = f ? f.name : t("pick");
  $("run").disabled = !f;
}
$("file").addEventListener("change", () => setFile($("file").files[0]));
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) { $("file").files = e.dataTransfer.files; setFile($("file").files[0]); }
});
$("run").addEventListener("click", () => request("file", $("run")));
$("demo").addEventListener("click", () => request("demo", $("demo")));
document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  storeSet("hf-lang", lang);
  applyLang();
  // Findings are written by the server, so switching language re-runs the last analysis.
  if (lastRequest) request(lastRequest, null, false);
}));

lang = storeGet("hf-lang") === "en" ? "en" : "he";
if (STATIC) {
  connectorList = STATIC.connectors;
  $("uploadPanel").classList.add("hidden");
  $("staticNote").classList.remove("hidden");
  applyLang();
  request("demo", null, false);
} else {
  applyLang();
  fetch("/api/connectors").then((r) => r.json()).then((list) => { connectorList = list; renderConnectors(); }).catch(() => {});
}
</script>
</body>
</html>
